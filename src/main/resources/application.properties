# Por defecto usa H2 en memoria (modo MySQL) para poder probar sin instalar nada.
# Para MySQL: -Ddb.url=jdbc:mysql://localhost:3306/inventario_ventas?useSSL=false&serverTimezone=America/Mexico_City
#             -Ddb.driver=com.mysql.cj.jdbc.Driver -Ddb.user=root -Ddb.password=... -Ddb.init=false
db.url=jdbc:h2:mem:inventario;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
db.driver=org.h2.Driver
db.user=sa
db.password=
db.init=true
